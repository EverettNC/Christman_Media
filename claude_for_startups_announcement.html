<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Christman AI Project × Claude for Startups</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #000509;
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* ── Particle canvas ── */
#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── Flash overlay ── */
#flash {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: white;
  opacity: 0;
  pointer-events: none;
}

/* ── Ambient glow bg ── */
.bg-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 900px 600px at 30% 50%, rgba(0,132,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 900px 600px at 70% 50%, rgba(232,120,77,0.05) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 3s ease;
}

/* ── Scene ── */
.scene {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

/* ── Logo stage ── */
.logo-stage {
  position: relative;
  width: 1200px;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Individual logos */
.logo-wrap {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  opacity: 0;
}

#logoClaude  { transform: translateX(-320px); }
#logoTCAP    { transform: translateX(320px);  }
#logoMerged  { transform: scale(0.7); opacity: 0; }

.logo-label {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
#logoClaude .logo-label  { color: #E8784D; text-shadow: 0 0 20px rgba(232,120,77,0.6); }
#logoTCAP   .logo-label  { color: #00F5FF; text-shadow: 0 0 20px rgba(0,245,255,0.6); }

/* ── Connector line (shown during merge) ── */
.connector {
  position: absolute;
  height: 2px;
  background: linear-gradient(90deg, #E8784D, #ffffff40, #00F5FF);
  width: 0;
  opacity: 0;
  border-radius: 1px;
  top: 50%;
  transform: translateY(-50%);
  filter: blur(0.5px);
}

/* ── Text block ── */
.text-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin-top: 12px;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-bottom: 14px;
}

.brand-tcap {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #00F5FF;
  text-shadow: 0 0 30px rgba(0,245,255,0.5);
  opacity: 0;
}

.brand-x {
  font-size: 28px;
  font-weight: 200;
  color: rgba(255,255,255,0.35);
  opacity: 0;
}

.brand-claude {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #E8784D;
  text-shadow: 0 0 30px rgba(232,120,77,0.5);
  opacity: 0;
}

.headline {
  font-size: 58px;
  font-weight: 900;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #ffffff;
  text-shadow: 0 0 60px rgba(255,255,255,0.2);
  opacity: 0;
  margin-bottom: 32px;
}

.divider-line {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, #00F5FF 30%, #E8784D 70%, transparent 100%);
  margin-bottom: 28px;
  transition: width 1.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 12px rgba(0,245,255,0.4);
}

.tagline {
  font-size: 24px;
  font-weight: 300;
  color: rgba(255,255,255,0.65);
  letter-spacing: 0.05em;
  opacity: 0;
  margin-bottom: 24px;
  font-style: italic;
}

.finale {
  font-size: 80px;
  font-weight: 900;
  letter-spacing: 0.04em;
  opacity: 0;
  background: linear-gradient(135deg, #00F5FF 0%, #0084FF 40%, #E8784D 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 30px rgba(0,245,255,0.5));
}

/* ── Keyframes ── */
@keyframes claudePulse {
  0%, 100% { filter: drop-shadow(0 0 18px rgba(232,120,77,0.5)) drop-shadow(0 0 40px rgba(232,120,77,0.25)); }
  50%       { filter: drop-shadow(0 0 36px rgba(232,120,77,0.9)) drop-shadow(0 0 80px rgba(232,120,77,0.45)); }
}
@keyframes tcapPulse {
  0%, 100% { filter: drop-shadow(0 0 18px rgba(0,245,255,0.5)) drop-shadow(0 0 40px rgba(0,245,255,0.25)); }
  50%       { filter: drop-shadow(0 0 36px rgba(0,245,255,0.9)) drop-shadow(0 0 80px rgba(0,245,255,0.45)); }
}
@keyframes mergePulse {
  0%, 100% {
    filter: drop-shadow(0 0 24px rgba(0,245,255,0.5)) drop-shadow(0 0 50px rgba(232,120,77,0.35));
  }
  50% {
    filter: drop-shadow(0 0 50px rgba(0,245,255,0.9)) drop-shadow(0 0 90px rgba(232,120,77,0.6));
  }
}
@keyframes orbit {
  from { transform: rotate(0deg);   }
  to   { transform: rotate(360deg); }
}
@keyframes orbitRev {
  from { transform: rotate(0deg);   }
  to   { transform: rotate(-360deg);}
}
@keyframes finaleGlow {
  0%, 100% { filter: drop-shadow(0 0 20px rgba(0,245,255,0.5)); }
  50%       { filter: drop-shadow(0 0 50px rgba(0,245,255,0.9)) drop-shadow(0 0 80px rgba(232,120,77,0.5)); }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="bg-glow" id="bgGlow"></div>
<div id="flash"></div>

<div class="scene">

  <!-- ── Logo Merge Stage ── -->
  <div class="logo-stage">

    <!-- Claude Asterisk -->
    <div class="logo-wrap" id="logoClaude">
      <svg width="150" height="150" viewBox="0 0 150 150" id="claudeSvg">
        <g transform="translate(75,75)" stroke="#E8784D" stroke-width="9" stroke-linecap="round">
          <line x1="0" y1="-58" x2="0" y2="58"/>
          <line x1="0" y1="-58" x2="0" y2="58" transform="rotate(60)"/>
          <line x1="0" y1="-58" x2="0" y2="58" transform="rotate(120)"/>
        </g>
        <circle cx="75" cy="75" r="13" fill="#E8784D" opacity="0.95"/>
        <circle cx="75" cy="75" r="22" fill="none" stroke="#E8784D" stroke-width="1.5" opacity="0.3"/>
      </svg>
      <span class="logo-label">Claude for Startups</span>
    </div>

    <!-- TCAP / Luma Cognify -->
    <div class="logo-wrap" id="logoTCAP">
      <svg width="150" height="150" viewBox="0 0 150 150" id="tcapSvg">
        <!-- Outer hex -->
        <polygon
          points="75,8 131,39 131,111 75,142 19,111 19,39"
          fill="none" stroke="#00F5FF" stroke-width="2.5" opacity="0.45"
        />
        <!-- Inner hex -->
        <polygon
          points="75,30 108,48.5 108,101.5 75,120 42,101.5 42,48.5"
          fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.25"
        />
        <!-- Neural connections -->
        <line x1="75" y1="8"   x2="75" y2="30"  stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
        <line x1="75" y1="120" x2="75" y2="142" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
        <line x1="131" y1="39" x2="108" y2="48.5" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
        <line x1="19"  y1="39" x2="42"  y2="48.5" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
        <line x1="131" y1="111" x2="108" y2="101.5" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
        <line x1="19"  y1="111" x2="42"  y2="101.5" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
        <!-- Center node -->
        <circle cx="75" cy="75" r="20" fill="none" stroke="#00F5FF" stroke-width="2.5" opacity="0.7"/>
        <circle cx="75" cy="75" r="7"  fill="#00F5FF"/>
        <!-- Hex corner nodes -->
        <circle cx="75"  cy="8"   r="4.5" fill="#00F5FF" opacity="0.8"/>
        <circle cx="131" cy="39"  r="4.5" fill="#00F5FF" opacity="0.8"/>
        <circle cx="131" cy="111" r="4.5" fill="#00F5FF" opacity="0.8"/>
        <circle cx="75"  cy="142" r="4.5" fill="#00F5FF" opacity="0.8"/>
        <circle cx="19"  cy="111" r="4.5" fill="#00F5FF" opacity="0.8"/>
        <circle cx="19"  cy="39"  r="4.5" fill="#00F5FF" opacity="0.8"/>
        <!-- Inner corner nodes -->
        <circle cx="75"  cy="30"    r="3" fill="#00F5FF" opacity="0.5"/>
        <circle cx="108" cy="48.5"  r="3" fill="#00F5FF" opacity="0.5"/>
        <circle cx="108" cy="101.5" r="3" fill="#00F5FF" opacity="0.5"/>
        <circle cx="75"  cy="120"   r="3" fill="#00F5FF" opacity="0.5"/>
        <circle cx="42"  cy="101.5" r="3" fill="#00F5FF" opacity="0.5"/>
        <circle cx="42"  cy="48.5"  r="3" fill="#00F5FF" opacity="0.5"/>
      </svg>
      <span class="logo-label">Luma Cognify AI</span>
    </div>

    <!-- Connector beam (drawn during merge) -->
    <div class="connector" id="connector"></div>

    <!-- Merged Mark (appears after flash) -->
    <div class="logo-wrap" id="logoMerged">
      <svg width="170" height="170" viewBox="0 0 170 170">
        <defs>
          <linearGradient id="mg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#00F5FF"/>
            <stop offset="50%"  stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#E8784D"/>
          </linearGradient>
          <filter id="mglow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g transform="translate(85,85)" filter="url(#mglow)">
          <!-- Outer orbital rings -->
          <g opacity="0.35">
            <ellipse rx="75" ry="28" fill="none" stroke="url(#mg1)" stroke-width="1.2" stroke-dasharray="5 4">
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse rx="75" ry="28" fill="none" stroke="url(#mg1)" stroke-width="1.2" stroke-dasharray="5 4" transform="rotate(60)">
              <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse rx="75" ry="28" fill="none" stroke="url(#mg1)" stroke-width="1.2" stroke-dasharray="5 4" transform="rotate(120)">
              <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
            </ellipse>
          </g>
          <!-- Hex outer -->
          <polygon points="0,-65 56.3,-32.5 56.3,32.5 0,65 -56.3,32.5 -56.3,-32.5"
                   fill="none" stroke="url(#mg1)" stroke-width="2" opacity="0.5"/>
          <!-- Asterisk -->
          <g stroke="url(#mg1)" stroke-width="8" stroke-linecap="round">
            <line x1="0" y1="-52" x2="0" y2="52"/>
            <line x1="0" y1="-52" x2="0" y2="52" transform="rotate(60)"/>
            <line x1="0" y1="-52" x2="0" y2="52" transform="rotate(120)"/>
          </g>
          <!-- Center -->
          <circle r="16" fill="url(#mg1)"/>
          <circle r="7"  fill="white"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- ── Text Block ── -->
  <div class="text-block">
    <div class="brand-row">
      <span class="brand-tcap"   id="brandTCAP">The Christman AI Project</span>
      <span class="brand-x"      id="brandX">×</span>
      <span class="brand-claude" id="brandClaude">Claude for Startups</span>
    </div>
    <div class="headline" id="headline">Officially Accepted</div>
    <div class="divider-line" id="divider"></div>
    <div class="tagline"  id="tagline">From a disability check and a refusal to quit.</div>
    <div class="finale"   id="finale">We're in.</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// PARTICLE SYSTEM
// ══════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('particles');
const ctx    = canvas.getContext('2d');
canvas.width  = 1920;
canvas.height = 1080;

const N = 160;
const parts = Array.from({length: N}, () => ({
  x: Math.random() * 1920,
  y: Math.random() * 1080,
  r: 0.8 + Math.random() * 2.2,
  vx: (Math.random() - 0.5) * 0.4,
  vy: -(0.2 + Math.random() * 0.5),
  hue: Math.random() > 0.5 ? 'cyan' : 'orange',
  alpha: 0.1 + Math.random() * 0.5,
  phase: Math.random() * Math.PI * 2,
  speed: 0.008 + Math.random() * 0.02,
}));

function drawParticles(ts) {
  ctx.clearRect(0, 0, 1920, 1080);
  parts.forEach(p => {
    p.phase += p.speed;
    const a = p.alpha * (0.55 + 0.45 * Math.sin(p.phase));
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.hue === 'cyan'
      ? `rgba(0,245,255,${a})`
      : `rgba(232,120,77,${a})`;
    ctx.fill();
    p.x += p.vx; p.y += p.vy;
    if (p.y < -8)    { p.y = 1088; p.x = Math.random() * 1920; }
    if (p.x < -8)    { p.x = 1928; }
    if (p.x > 1928)  { p.x = -8;   }
  });
  requestAnimationFrame(drawParticles);
}
requestAnimationFrame(drawParticles);

// ══════════════════════════════════════════════════════════════════════════════
// ANIMATION ENGINE
// ══════════════════════════════════════════════════════════════════════════════
function easeOut(t)    { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t)  { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOutBack(t){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

function tween(from, to, dur, delay, cb, easeFn=easeInOut) {
  setTimeout(() => {
    const t0 = performance.now();
    function tick(now) {
      const p = Math.min((now - t0) / dur, 1);
      cb(from + (to - from) * easeFn(p));
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }, delay);
}

// Fade a single element
function fadeTo(el, target, dur, delay, easeFn=easeInOut) {
  tween(parseFloat(el.style.opacity || 0), target, dur, delay, v => {
    el.style.opacity = v;
  }, easeFn);
}

// Fade + slide from X offset
function slideIn(el, fromX, dur, delay) {
  el.style.opacity   = 0;
  el.style.transform = `translateX(${fromX}px)`;
  setTimeout(() => {
    const t0 = performance.now();
    function tick(now) {
      const p = Math.min((now - t0) / dur, 1);
      const e = easeOut(p);
      el.style.opacity   = e;
      el.style.transform = `translateX(${fromX * (1 - e)}px)`;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }, delay);
}

// Slide two elements toward each other
function slideTo(el, fromX, toX, dur, delay) {
  setTimeout(() => {
    const t0 = performance.now();
    function tick(now) {
      const p = Math.min((now - t0) / dur, 1);
      const e = easeInOut(p);
      el.style.transform = `translateX(${fromX + (toX - fromX) * e}px)`;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }, delay);
}

// ══════════════════════════════════════════════════════════════════════════════
// TIMELINE
// ══════════════════════════════════════════════════════════════════════════════
const T = {
  BG_GLOW:       400,
  CLAUDE_IN:    1000,
  TCAP_IN:      2000,
  CONNECTOR:    3200,
  MERGE_START:  3600,
  MERGE_FADE:   4400,
  FLASH:        4800,
  MERGED_IN:    5100,
  BRAND_TCAP:   6400,
  BRAND_X:      7200,
  BRAND_CLAUDE: 7700,
  HEADLINE:     8600,
  DIVIDER:      9500,
  TAGLINE:     10600,
  FINALE_FLASH:12400,
  FINALE:      12450,
};

const logoClaude  = document.getElementById('logoClaude');
const logoTCAP    = document.getElementById('logoTCAP');
const logoMerged  = document.getElementById('logoMerged');
const connector   = document.getElementById('connector');
const flash       = document.getElementById('flash');
const bgGlow      = document.getElementById('bgGlow');

// BG glow on
setTimeout(() => { bgGlow.style.opacity = 1; }, T.BG_GLOW);

// Claude logo slides in from left
slideIn(logoClaude, -320, 900, T.CLAUDE_IN);
setTimeout(() => {
  document.getElementById('claudeSvg').style.animation = 'claudePulse 2s ease-in-out infinite';
}, T.CLAUDE_IN + 1000);

// TCAP logo slides in from right
slideIn(logoTCAP, 320, 900, T.TCAP_IN);
setTimeout(() => {
  document.getElementById('tcapSvg').style.animation = 'tcapPulse 2s ease-in-out infinite';
}, T.TCAP_IN + 1000);

// Connector beam draws in
setTimeout(() => {
  connector.style.transition = 'opacity 0.4s, width 0.8s cubic-bezier(0.16,1,0.3,1)';
  connector.style.opacity = '1';
  connector.style.width   = '420px';
}, T.CONNECTOR);

// Both logos slide toward center
slideTo(logoClaude, -320,  -4, 900, T.MERGE_START);
slideTo(logoTCAP,    320,   4, 900, T.MERGE_START);

// Connector contracts as logos meet
setTimeout(() => {
  connector.style.transition = 'width 0.7s ease-in';
  connector.style.width      = '0px';
}, T.MERGE_START + 200);

// Logos fade out just before flash
setTimeout(() => {
  logoClaude.style.transition = 'opacity 0.25s ease-in';
  logoTCAP.style.transition   = 'opacity 0.25s ease-in';
  logoClaude.style.opacity    = '0';
  logoTCAP.style.opacity      = '0';
}, T.MERGE_FADE);

// White flash
setTimeout(() => {
  flash.style.transition = 'opacity 0.12s ease-in';
  flash.style.opacity    = '1';
  setTimeout(() => {
    flash.style.transition = 'opacity 0.7s ease-out';
    flash.style.opacity    = '0';
  }, 120);
}, T.FLASH);

// Merged mark appears after flash
setTimeout(() => {
  logoMerged.style.transition = 'opacity 1s ease, transform 1.1s cubic-bezier(0.34,1.56,0.64,1)';
  logoMerged.style.opacity    = '1';
  logoMerged.style.transform  = 'scale(1)';
  setTimeout(() => {
    logoMerged.style.animation = 'mergePulse 2.8s ease-in-out infinite';
  }, 1200);
}, T.MERGED_IN);

// Text reveals
fadeTo(document.getElementById('brandTCAP'),   1, 900, T.BRAND_TCAP);
fadeTo(document.getElementById('brandX'),      1, 700, T.BRAND_X);
fadeTo(document.getElementById('brandClaude'), 1, 900, T.BRAND_CLAUDE);

fadeTo(document.getElementById('headline'), 1, 1100, T.HEADLINE, easeOut);

setTimeout(() => {
  document.getElementById('divider').style.width = '700px';
}, T.DIVIDER);

fadeTo(document.getElementById('tagline'), 1, 1000, T.TAGLINE, easeOut);

// Mini flash before finale
setTimeout(() => {
  flash.style.transition = 'opacity 0.07s ease-in';
  flash.style.opacity    = '0.25';
  setTimeout(() => {
    flash.style.transition = 'opacity 0.5s ease-out';
    flash.style.opacity    = '0';
  }, 70);
}, T.FINALE_FLASH);

// Finale
setTimeout(() => {
  const el = document.getElementById('finale');
  el.style.transition = 'opacity 1.3s ease, transform 1.3s cubic-bezier(0.34,1.3,0.64,1)';
  el.style.transform  = 'scale(0.85)';
  el.style.opacity    = '0';
  setTimeout(() => {
    el.style.opacity   = '1';
    el.style.transform = 'scale(1)';
    setTimeout(() => { el.style.animation = 'finaleGlow 2.5s ease-in-out infinite'; }, 1400);
  }, 80);
}, T.FINALE);
</script>
</body>
</html>
